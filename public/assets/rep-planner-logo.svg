<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 46 46"
  width="46"
  height="46"
  role="img"
  aria-labelledby="brand-logo-title"
>
  <title id="brand-logo-title">Repertory Planner app logo</title>
  <defs>
    <linearGradient id="brand-logo-background" x1="8" y1="8" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="brand-logo-shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <circle cx="23" cy="23" r="20" fill="url(#brand-logo-background)" filter="url(#brand-logo-shadow)" />
  <circle cx="23" cy="23" r="22.5" fill="none" stroke="#10b981" stroke-opacity="0.18" />

  <g transform="translate(12 12) scale(0.6875)">
    <path
      d="M5 16 Q 6 4, 16 3 Q 26 4, 27 16"
      stroke="#0f172a"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
    />
    <ellipse cx="5" cy="18" rx="2.5" ry="3.5" fill="#0f172a" />
    <ellipse cx="27" cy="18" rx="2.5" ry="3.5" fill="#0f172a" />
    <circle cx="12" cy="17" r="3" fill="white" />
    <circle cx="20" cy="17" r="3" fill="white" />
    <circle cx="12" cy="18.4" r="1.4" fill="#0f172a" />
    <circle cx="20" cy="18.4" r="1.4" fill="#0f172a" />
    <path
      d="M13 24 Q 16 27, 19 24"
      stroke="#0f172a"
      stroke-width="1.6"
      fill="none"
      stroke-linecap="round"
    />
  </g>
</svg>
